<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>🍌 Banana Classifiser</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff8dc,
                    #f7e98e
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);

            text-align: center;
        }


        h1 {

            margin-top: 0;

            margin-bottom: 10px;

            color: #333;

            font-size: 32px;
        }


        .subtitle {

            color: #777;

            margin-bottom: 30px;

            line-height: 1.5;
        }


        /* Hide normal file input */

        input[type="file"] {

            display: none;
        }


        /* Browse button */

        .browse-button {

            display: inline-block;

            background: #f5c400;

            color: #222;

            padding: 13px 25px;

            border-radius: 10px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;
        }


        .browse-button:hover {

            background: #e5b600;

            transform: translateY(-1px);
        }


        /* Image preview */

        #preview {

            display: none;

            width: 280px;

            height: 280px;

            object-fit: contain;

            margin: 25px auto;

            border-radius: 15px;

            border: 2px solid #ddd;

            background: #fafafa;
        }


        /* Predict button */

        #predictButton {

            display: none;

            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 10px;

            background: #333;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        #predictButton:hover {

            background: #555;

            transform: translateY(-1px);
        }


        #predictButton:disabled {

            background: #999;

            cursor: not-allowed;

            transform: none;
        }


        /* Loading message */

        #loading {

            display: none;

            margin-top: 20px;

            color: #777;

            font-weight: bold;
        }


        /* Result box */

        #result {

            display: none;

            margin-top: 25px;

            padding: 22px;

            border-radius: 15px;

            background: #f5f5f5;

            border: 1px solid #ddd;
        }


        .prediction {

            font-size: 28px;

            font-weight: bold;

            color: #333;

            text-transform: capitalize;
        }


        .confidence {

            margin-top: 10px;

            font-size: 19px;

            color: #666;
        }


        /* Error box */

        #errorBox {

            display: none;

            margin-top: 20px;

            padding: 15px;

            border-radius: 10px;

            background: #ffe5e5;

            color: #b00020;

            border: 1px solid #ffb3b3;

            text-align: left;

            word-wrap: break-word;
        }


        /* Footer */

        .footer {

            margin-top: 25px;

            font-size: 13px;

            color: #999;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- Title -->

    <h1>
        🍌 Banana Classifier
    </h1>


    <p class="subtitle">

        Upload an image and let the
        trained machine-learning model
        classify it.

    </p>


    <!-- Browse button -->

    <label
        for="imageInput"
        class="browse-button">

        📁 Browse Image

    </label>


    <input
        type="file"
        id="imageInput"
        accept="image/*">


    <!-- Image preview -->

    <img
        id="preview"
        alt="Selected image">


    <!-- Predict button -->

    <button
        id="predictButton">

        🔍 Predict

    </button>


    <!-- Loading -->

    <div id="loading">

        ⏳ Analyzing image...

    </div>


    <!-- Result -->

    <div id="result">

        <div
            id="prediction"
            class="prediction">

        </div>


        <div
            id="confidence"
            class="confidence">

        </div>

    </div>


    <!-- Error -->

    <div
        id="errorBox">

    </div>


    <div class="footer">

        Powered by TensorFlow + Flask

    </div>


</div>



<script>


    // =====================================
    // Get HTML elements
    // =====================================

    const imageInput =
        document.getElementById(
            "imageInput"
        );


    const preview =
        document.getElementById(
            "preview"
        );


    const predictButton =
        document.getElementById(
            "predictButton"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const result =
        document.getElementById(
            "result"
        );


    const prediction =
        document.getElementById(
            "prediction"
        );


    const confidence =
        document.getElementById(
            "confidence"
        );


    const errorBox =
        document.getElementById(
            "errorBox"
        );



    // =====================================
    // When user selects an image
    // =====================================

    imageInput.addEventListener(
        "change",
        function () {


            const file =
                this.files[0];


            if (!file) {

                return;

            }


            // Check that file is an image

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                showError(
                    "Please select an image file."
                );

                return;

            }


            // Create image preview

            const reader =
                new FileReader();


            reader.onload =
                function (event) {


                    preview.src =
                        event.target.result;


                    preview.style.display =
                        "block";


                    predictButton.style.display =
                        "block";


                    result.style.display =
                        "none";


                    errorBox.style.display =
                        "none";

                };


            reader.readAsDataURL(file);

        }
    );



    // =====================================
    // Predict button
    // =====================================

    predictButton.addEventListener(
        "click",
        async function () {


            const file =
                imageInput.files[0];


            // Make sure an image exists

            if (!file) {

                showError(
                    "Please select an image first."
                );

                return;

            }


            // Create FormData

            const formData =
                new FormData();


            formData.append(
                "image",
                file
            );


            // Show loading

            loading.style.display =
                "block";


            predictButton.disabled =
                true;


            result.style.display =
                "none";


            errorBox.style.display =
                "none";


            try {


                console.log(
                    "Sending image to server..."
                );


                // Send image to Flask

                const response =
                    await fetch(
                        "/predict",
                        {
                            method: "POST",

                            body: formData
                        }
                    );


                console.log(
                    "HTTP status:",
                    response.status
                );


                // Try to read JSON

                const data =
                    await response.json();


                console.log(
                    "Server response:",
                    data
                );


                // Check server response

                if (!response.ok) {


                    throw new Error(
                        data.error ||
                        "The server could not process the image."
                    );

                }


                // Make sure prediction exists

                if (
                    !data.prediction
                ) {

                    throw new Error(
                        "The server did not return a prediction."
                    );

                }


                // Display prediction

                prediction.textContent =
                    "Prediction: "
                    + data.prediction;


                // Display confidence

                confidence.textContent =
                    "Confidence: "
                    + data.confidence
                    + "%";


                // Show result

                result.style.display =
                    "block";


            }

            catch (error) {


                console.error(
                    "Prediction error:",
                    error
                );


                showError(
                    "Prediction failed: "
                    + error.message
                );

            }


            finally {


                loading.style.display =
                    "none";


                predictButton.disabled =
                    false;

            }

        }
    );



    // =====================================
    // Display error
    // =====================================

    function showError(
        message
    ) {


        errorBox.textContent =
            "⚠️ " + message;


        errorBox.style.display =
            "block";

    }


</script>


</body>

</html>
